<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="coinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background Rounded Square -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>

  <!-- Wallet Body -->
  <g filter="url(#shadow)">
    <rect x="96" y="148" width="320" height="220" rx="36" fill="#FFFFFF"/>
    <!-- Wallet Flap Pocket -->
    <path d="M96 200 C96 172 118 148 148 148 L364 148 C394 148 416 172 416 200 L416 220 L96 220 Z" fill="#F1F5F9"/>
    <!-- Clasp / Lock -->
    <rect x="296" y="228" width="120" height="64" rx="20" fill="url(#coinGrad)"/>
    <!-- Small golden coin dot -->
    <circle cx="340" cy="260" r="12" fill="#FFFFFF"/>
  </g>

  <!-- Financial Growth Trend Accent -->
  <path d="M140 310 L200 260 L250 280 L310 220" stroke="#2563EB" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <circle cx="310" cy="220" r="8" fill="#2563EB"/>
</svg>
